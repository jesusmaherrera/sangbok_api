services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sangbok:sangbok@db:5432/sangbok
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sangbok
      POSTGRES_PASSWORD: sangbok
      POSTGRES_DB: sangbok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sangbok"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
